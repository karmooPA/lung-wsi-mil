name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUNG_WSI_HISTORY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - name: Install tested CPU torch pair
        run: python -m pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install remaining tested dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run compile, unit, integration and recorded-audit checks
        run: python scripts/run_quality_checks.py
      - name: Build wheel and source distribution
        run: python -m build
