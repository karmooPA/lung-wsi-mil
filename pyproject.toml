[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-wsi-mil"
version = "0.2.0"
description = "Reproducible TCGA-LUSC preprocessing, KimiaNet features, and attention MIL"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "karmooPA", email = "kardostmohammad.h.p@gmail.com"},
  {name = "mragetsars", email = "mragetsars@gmail.com"},
]
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
lung-wsi-pipeline = "lung_wsi_mil.workflows.workspace:main"
lung-wsi-audit = "lung_wsi_mil.audit.inventory:main"
lung-wsi-validate-sources = "lung_wsi_mil.audit.sources:main"
lung-wsi-preprocess = "lung_wsi_mil.preprocessing.batch_preprocessing:main"
lung-wsi-preview = "lung_wsi_mil.augmentation.preview:main"
lung-wsi-pilot = "lung_wsi_mil.workflows.pilot:main"
lung-wsi-process = "lung_wsi_mil.workflows.dataset:main"
lung-wsi-verify-pilot = "lung_wsi_mil.workflows.verify_pilot:main"
lung-wsi-verify-dataset = "lung_wsi_mil.workflows.verify_dataset:main"
lung-wsi-extract = "lung_wsi_mil.features.extract:main"
lung-wsi-splits = "lung_wsi_mil.data.generate_splits:main"
lung-wsi-experiment = "lung_wsi_mil.experiments.cli:main"
lung-wsi-heatmap = "lung_wsi_mil.visualization.attention:main"
lung-wsi-deliver-folds = "lung_wsi_mil.workflows.fold_delivery:main"

[project.urls]
Repository = "https://github.com/karmooPA/lung-wsi-mil"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lung_wsi_mil*"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/base.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
audit = {file = ["requirements/audit.txt"]}
augmentation = {file = ["requirements/augmentation.txt"]}
mil = {file = ["requirements/augmentation.txt", "requirements/mil.txt"]}
dev = {file = ["requirements/augmentation.txt", "requirements/mil.txt", "requirements/dev.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-config --strict-markers"
norecursedirs = ["work", "build", "dist", ".git", ".venv"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["lung_wsi_mil", "tests"]
